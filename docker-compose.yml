services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "port=55432"]
    environment:
      POSTGRES_DB: aquata
      POSTGRES_USER: aquata
      POSTGRES_PASSWORD: aquata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquata -d aquata -p 55432"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "55432:55432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://aquata:aquata@postgres:55432/aquata
      NODE_ENV: development
      PORT: 3300
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3300:3300"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:3300
    depends_on:
      - api
    ports:
      - "5174:5174"

volumes:
  postgres-data:
