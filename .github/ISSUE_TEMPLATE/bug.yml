name: Bug report
description: Report reproducible behavior that conflicts with the current product or engineering contract.
title: "[Bug]: "
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Aquata. Do not include secrets, private account data, or security vulnerabilities here.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, and where did it happen?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Link the owning product or engineering document when applicable.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence, including relevant account, season, tick, or viewport state without private data.
      placeholder: |
        1. Start with ...
        2. Submit ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Player impact
      description: Explain severity, frequency, and whether progress, resources, permissions, or information boundaries are affected.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add sanitized logs, screenshots, reports, or failing test output when useful.
  - type: dropdown
    id: regression
    attributes:
      label: Regression
      options:
        - Unknown
        - Yes, this worked before
        - No, this is newly implemented behavior
    validations:
      required: true
